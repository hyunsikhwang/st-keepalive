name: Keep Streamlit Alive (Playwright)

on:
  schedule:
    - cron: '0 */2 * * *' # 2시간마다 실행
  workflow_dispatch:

jobs:
  run_playwright:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          # [중요] 여기서 MY_PAT를 사용해야 이후 푸시(Push) 권한이 생깁니다.
          token: ${{ secrets.MY_PAT }}
          # 날짜 계산을 위해 커밋 기록(History)을 모두 가져옵니다.
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          pip install -r requirements.txt

      - name: Install Playwright Browsers
        run: |
          playwright install chromium

      - name: Run script
        run: python visit_app.py

      # --- [수정된 부분] 외부 Action 대신 직접 구현한 비활성화 방지 로직 ---
      - name: Auto Commit if needed
        run: |
          # 1. 깃 설정 (가상 유저 정보)
          git config user.name "GitHub Action Bot"
          git config user.email "action@github.com"

          # 2. 마지막 커밋 날짜 확인
          last_commit_unix=$(git log -1 --format=%ct)
          current_unix=$(date +%s)
          seconds_diff=$((current_unix - last_commit_unix))
          days_diff=$((seconds_diff / 86400))

          echo "📅 마지막 커밋으로부터 ${days_diff}일이 지났습니다."

          # 3. 50일이 지났다면 빈 커밋 생성 후 푸시
          if [ $days_diff -gt 50 ]; then
            echo "⚠️ 50일 제한에 근접했습니다. 자동 커밋을 생성합니다..."
            
            # 빈 커밋 생성 (--allow-empty 옵션 사용)
            git commit --allow-empty -m "Keep alive: Automated activity check"
            
            # 변경사항 푸시
            git push
            echo "✅ 푸시 완료! 워크플로우 수명이 연장되었습니다."
          else
            echo "✅ 아직 커밋할 필요가 없습니다. (50일 미만)"
          fi
